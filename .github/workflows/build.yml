name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        run: ./get_frameworks.sh

      - name: Get resources
        run: ./get_resources.sh

      - name: Copy xcconfig
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Patch sideload compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # Patch 1:
          # App Group / iCloud fallback.
          #
          # In sideloaded builds, App Groups and iCloud containers may be
          # unavailable. Blink normally expects them, so we fall back to
          # the normal Documents folder instead of crashing on launch.
          # ------------------------------------------------------------

          p = Path("BlinkConfig/BlinkPaths.m")
          s = p.read_text()

          s, n1 = re.subn(
              r'NSString \*path = \[fm containerURLForSecurityApplicationGroupIdentifier:groupID\]\.path;\s*__groupContainerPath = path;',
              '''NSURL *groupURL = [fm containerURLForSecurityApplicationGroupIdentifier:groupID];
            NSString *path = groupURL.path;

            if (path == nil) {
              path = [self documentsPath];
              NSLog(@"App Group container unavailable. Falling back to Documents path: %@", path);
            }

            __groupContainerPath = path;
            [self _ensureFolderAtPath:__groupContainerPath];''',
              s
          )

          s, n2 = re.subn(
              r'NSString \*path = \[\[fm URLForUbiquityContainerIdentifier:iCloudID\] URLByAppendingPathComponent:@"Documents"\]\.path;\s*\[self _ensureFolderAtPath:path\];\s*__iCloudsDriveDocumentsPath = path;',
              '''NSURL *iCloudURL = [fm URLForUbiquityContainerIdentifier:iCloudID];
            NSString *path = [iCloudURL URLByAppendingPathComponent:@"Documents"].path;

            if (path == nil) {
              path = [self documentsPath];
              NSLog(@"iCloud container unavailable. Falling back to Documents path: %@", path);
            }

            [self _ensureFolderAtPath:path];
            __iCloudsDriveDocumentsPath = path;''',
              s
          )

          if n1 != 1:
              raise SystemExit(f"groupContainerPath patch failed, replacements: {n1}")

          if n2 != 1:
              raise SystemExit(f"iCloudDriveDocuments patch failed, replacements: {n2}")

          p.write_text(s)
          print("Patched BlinkConfig/BlinkPaths.m")

          # ------------------------------------------------------------
          # Patch 2:
          # Disable File Provider replicated migration.
          #
          # The latest crash log shows the app aborting inside:
          # MigrationFileProviderReplicatedExtension.deleteFileProviderStorage()
          # -> NSFileProviderManager documentStorageURL
          #
          # That File Provider migration requires entitlements that are not
          # reliable in a normal free sideload/AltStore install.
          # ------------------------------------------------------------

          p = Path("Blink/Migrator/Migrator.swift")
          s = p.read_text()

          s2, n3 = re.subn(
              r'\s*MigrationFileProviderReplicatedExtension\(\),',
              '\n      // MigrationFileProviderReplicatedExtension(), // disabled for sideload build',
              s
          )

          if n3 != 1:
              raise SystemExit(f"MigrationFileProviderReplicatedExtension patch failed, replacements: {n3}")

          p.write_text(s2)
          print("Disabled MigrationFileProviderReplicatedExtension for sideload build")
          PY

      - name: List schemes and destinations
        run: |
          xcodebuild -list -project Blink.xcodeproj
          xcodebuild -showdestinations -project Blink.xcodeproj -scheme Blink

      - name: Build unsigned Release app for iOS
        run: |
          set -o pipefail

          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            IPHONEOS_DEPLOYMENT_TARGET=16.1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            SUPPORTS_MACCATALYST=NO \
            | tee build.log

      - name: Generate unsigned release ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Blink.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Blink.app was not found at: $APP_PATH"
            echo "Available .app bundles:"
            find build -name "*.app" -print
            exit 1
          fi

          rm -rf Payload Blink.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Blink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlinkShell
          path: Blink.ipa

      - name: Upload raw build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
